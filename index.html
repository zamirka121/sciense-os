<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCIENCE OS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#e8faff;font-family:Arial,sans-serif;padding:22px}
main{max-width:480px;margin:35px auto}
h1{color:#35d9ff;text-align:center;letter-spacing:3px}
.card{background:#102238;border:1px solid #1b5872;border-radius:18px;padding:22px;margin-top:20px}
input,button{width:100%;padding:14px;margin-top:12px;border-radius:10px;font-size:16px}
input{background:#07111f;color:white;border:1px solid #28728d}
button{background:#16bce5;color:#04121c;border:0;font-weight:bold}
.small{color:#9bb8c8;font-size:13px}
.secret{overflow-wrap:anywhere;color:#54e7ff;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>SCIENCE OS</h1>
<section class="card" id="create">
<h2>Создать аккаунт</h2>
<p class="small">Придумай свой никнейм.</p>
<input id="nickname" maxlength="20" placeholder="Твой ник">
<button onclick="createAccount()">Войти как гость</button>
</section>

<section class="card hidden" id="home">
<h2>Добро пожаловать!</h2>
<p>Твой ник: <b id="nick"></b></p>
<p class="small">Твой секретный ID для восстановления:</p>
<p class="secret" id="secret"></p>
<button onclick="copyID()">Скопировать ID</button>
<p class="small">Сохрани ID в надёжном месте. Ник виден в приложении, секретный ID никому не показывай.</p>
<button onclick="logout()">Выйти из аккаунта</button>
</section>
</main>

<script>
const KEY="science_os_guest_v1";

function showAccount(account){
 document.getElementById("create").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("nick").textContent=account.nickname;
 document.getElementById("secret").textContent=account.id;
}

function createAccount(){
 const nickname=document.getElementById("nickname").value.trim();
 if(!nickname){alert("Введи ник!");return;}
 const account={
  nickname:nickname,
  id:"SCI-"+crypto.randomUUID().toUpperCase()
 };
 localStorage.setItem(KEY,JSON.stringify(account));
 showAccount(account);
}

function copyID(){
 const id=document.getElementById("secret").textContent;
 navigator.clipboard.writeText(id)
 .then(()=>alert("ID скопирован!"))
 .catch(()=>alert("Выдели ID и скопируй вручную."));
}

function logout(){
 localStorage.removeItem(KEY);
 location.reload();
}

try{
 const saved=localStorage.getItem(KEY);
 if(saved) showAccount(JSON.parse(saved));
}catch(e){
 localStorage.removeItem(KEY);
}
</script>
</body>
</html>
