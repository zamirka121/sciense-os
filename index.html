<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCIENCE OS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06101e;color:#e8faff;font-family:Arial;padding:18px}
main{max-width:520px;margin:auto}
h1{color:#35d9ff;text-align:center;letter-spacing:3px}
h2{color:#48dfff}
.card{background:#102238;border:1px solid #1b5872;border-radius:16px;padding:18px;margin:14px 0}
input,textarea,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;font-size:16px}
input,textarea{background:#07111f;color:white;border:1px solid #28728d}
textarea{font-family:monospace;min-height:180px}
button{background:#16bce5;color:#04121c;border:0;font-weight:bold}
.secondary{background:#183b53;color:#e8faff;border:1px solid #28728d}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu button{min-height:82px;font-size:16px}
.tabs{display:flex;gap:8px}
.small{color:#9bb8c8;font-size:13px}
.secret{overflow-wrap:anywhere;color:#54e7ff;font-weight:bold}
.hidden{display:none}
#page{display:none}
a{color:#53dcff}
.modcode{white-space:pre-wrap;overflow-wrap:anywhere;background:#07111f;padding:12px;border-radius:10px}
.resource{display:block;padding:13px;margin-top:9px;background:#071a2b;border:1px solid #24536a;border-radius:10px;text-decoration:none;color:#61e2ff}
</style>
</head>
<body>
<main>
<h1>SCIENCE OS</h1>

<section class="card" id="create">
<h2>Создать аккаунт</h2>
<p class="small">Придумай свой никнейм.</p>
<input id="nickname" maxlength="20" placeholder="Твой ник">
<button onclick="createAccount()">Войти как гость</button>
</section>

<section id="home" class="hidden">
<div class="card">
<h2>Главная</h2>
<p>Пользователь: <b id="nick"></b></p>
<p class="small">Добро пожаловать в SCIENCE OS!</p>
</div>
<div class="menu">
<button onclick="openPage('messages')">💬 Сообщения</button>
<button onclick="openPage('games')">🎮 Научные игры</button>
<button onclick="openPage('diary')">📓 Дневники</button>
<button onclick="openPage('friends')">👥 Друзья</button>
<button onclick="openPage('lab')">🧪 Лаборатория</button>
<button onclick="openPage('mods')">🧩 Моды</button>
<button onclick="openPage('science')">🌐 Научный центр</button>
<button onclick="openPage('settings')">⚙️ Настройки</button>
</div>
</section>

<section id="page">
<div class="card">
<button class="secondary" onclick="backHome()">← Назад в меню</button>
<h2 id="pageTitle"></h2>
<div id="pageContent"></div>
</div>
</section>
</main>

<script>
const KEY="science_os_guest_v1";
const MODKEY="science_os_mods_v1";
let account=null;

function showAccount(a){
 account=a;
 document.getElementById("create").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("nick").textContent=a.nickname;
}

function createAccount(){
 const nickname=document.getElementById("nickname").value.trim();
 if(!nickname){alert("Введи ник!");return;}
 account={nickname,id:"SCI-"+crypto.randomUUID().toUpperCase()};
 localStorage.setItem(KEY,JSON.stringify(account));
 showAccount(account);
}

function openPage(name){
 document.getElementById("home").classList.add("hidden");
 document.getElementById("page").style.display="block";
 const title=document.getElementById("pageTitle");
 const content=document.getElementById("pageContent");

 const pages={
 messages:["Сообщения",`
 <p>Твой будущий научный чат.</p>
 <p class="small">Для настоящих сообщений понадобится облачная база.</p>`],

 games:["Научные игры",`
 <p>Какая планета известна своими кольцами?</p>
 <button onclick="answer('Марс')">Марс</button>
 <button onclick="answer('Сатурн')">Сатурн</button>
 <button onclick="answer('Земля')">Земля</button>
 <p id="answer"></p>`],

 diary:["Дневник",`
 <p class="small">Записи сохраняются на устройстве.</p>
 <textarea id="entry" placeholder="Научная запись..."></textarea>
 <button onclick="saveDiary()">Сохранить запись</button>
 <div id="entries"></div>`],

friends:["Друзья",`
 <p>Поиск пользователей по нику появится после подключения облачной базы.</p>`],

 lab:["Лаборатория",`
 <button onclick="alert('Раздел астрономии скоро появится!')">🔭 Астрономия</button>
 <button onclick="alert('Раздел метеорологии скоро появится!')">🌪️ Метеорология</button>
 <button onclick="alert('Раздел радиоастрономии скоро появится!')">📡 Радиоастрономия</button>`],

 mods:["Моды",`<div id="modArea"></div>`],

 science:["Научный центр",`
 <h3>🔎 Научный браузер</h3>
 <input id="searchQuery" placeholder="Что будем искать?">
 <button onclick="searchWeb()">Искать в интернете</button>
 <a class="resource" href="https://ru.wikipedia.org/" target="_blank">📚 Википедия</a>
 <a class="resource" href="https://www.nasa.gov/" target="_blank">🚀 NASA — космос</a>
 <a class="resource" href="https://science.nasa.gov/" target="_blank">🪐 NASA Science</a>
 <a class="resource" href="https://www.noaa.gov/" target="_blank">🌪️ NOAA — погода и климат</a>
 <a class="resource" href="https://www.esa.int/" target="_blank">🛰️ Европейское космическое агентство</a>
 <a class="resource" href="https://ui.adsabs.harvard.edu/" target="_blank">🔭 Научные статьи по астрономии</a>
 <a class="resource" href="https://www.windy.com/" target="_blank">🌬️ Карты погоды Windy</a>
 <hr>
 <h3>📡 Радиоэфир</h3>
 <p class="small">Публичные интернет-приёмники. Выбери приёмник и слушай доступный эфир.</p>
 <a class="resource" href="https://www.websdr.org/" target="_blank">🌍 Каталог радиоприёмников</a>
 <a class="resource" href="https://websdr.ewi.utwente.nl:8901/" target="_blank">🎧 Открыть приёмник в Нидерландах</a>
 <a class="resource" href="https://rx.linkfanel.net/" target="_blank">🗺️ Карта приёмников по всему миру</a>
 <a class="resource" href="https://receiverbook.de/" target="_blank">📻 Поиск интернет-приёмников</a>
 <p class="small">Если сайт не открывается внутри приложения, попробуй открыть его во внешнем браузере. Доступность зависит от самого приёмника.</p>
 `],

 settings:["Настройки",`
 <p>Аккаунт: <b>${escapeText(account.nickname)}</b></p>
 <p class="small">Секретный ID:</p>
 <p class="secret">${escapeText(account.id)}</p>
 <button onclick="copyID()">Скопировать ID</button>
 <button onclick="logout()">Выйти из аккаунта</button>`]
 };

 title.textContent=pages[name][0];
 content.innerHTML=pages[name][1];
 if(name==="diary")showDiary();
 if(name==="mods")showMods();
}

function searchWeb(){
 const q=document.getElementById("searchQuery").value.trim();
 if(!q){alert("Введи запрос!");return;}
 window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank");
}

function showMods(){
 document.getElementById("modArea").innerHTML=`
 <div class="tabs">
 <button onclick="showLibrary()">📚 Библиотека</button>
 <button onclick="showWorkshop()">🛠️ Мастерская</button>
 </div>
 <div id="modContent"></div>`;
 showLibrary();
}

function getMods(){
 try{return JSON.parse(localStorage.getItem(MODKEY)||"[]")}
 catch(e){return []}
}

function showLibrary(){
 const area=document.getElementById("modContent");
 const mods=getMods();
 area.innerHTML="<h2>📚 Библиотека модов</h2><div id='modList'></div>";
 const list=document.getElementById("modList");
 if(!mods.length){
  list.textContent="Библиотека пока пуста. Создай первый мод!";
  return;
 }
 mods.forEach((mod,index)=>{
  const card=document.createElement("div");
  card.className="card";
  const h=document.createElement("h3");
  h.textContent=mod.name;
  const d=document.createElement("p");
  d.textContent=mod.description||"Без описания";
  const view=document.createElement("button");
  view.textContent="Посмотреть код";
  view.onclick=()=>viewMod(index);
  const remove=document.createElement("button");
  remove.className="secondary";
  remove.textContent="Удалить";
  remove.onclick=()=>deleteMod(index);
  card.append(h,d,view,remove);
  list.append(card);
 });
}

function showWorkshop(){
 document.getElementById("modContent").innerHTML=`
 <h2>🛠️ Мастерская</h2>

<p class="small">Создавай свои модификации.</p>
 <button onclick="newMod()">＋ Создать мод</button>
 <div id="modEditor"></div>`;
}

function newMod(){
 document.getElementById("modEditor").innerHTML=`
 <div class="card">
 <input id="modName" maxlength="35" placeholder="Название мода">
 <input id="modDescription" maxlength="100" placeholder="Описание">
 <p class="small">Код JavaScript:</p>
 <textarea id="modCode" spellcheck="false" placeholder="// Код твоего мода"></textarea>
 <button onclick="saveMod()">💾 Сохранить мод</button>
 <p class="small">Запуск кода пока отключён. Моды можно сохранять и просматривать.</p>
 </div>`;
}

function saveMod(){
 const name=document.getElementById("modName").value.trim();
 const description=document.getElementById("modDescription").value.trim();
 const code=document.getElementById("modCode").value;
 if(!name||!code.trim()){alert("Заполни название и код!");return;}
 const mods=getMods();
 mods.push({name,description,code});
 localStorage.setItem(MODKEY,JSON.stringify(mods));
 alert("Мод сохранён!");
 showLibrary();
}

function viewMod(index){
 const mod=getMods()[index];
 const area=document.getElementById("modContent");
 area.innerHTML="";
 const back=document.createElement("button");
 back.className="secondary";
 back.textContent="← Библиотека";
 back.onclick=showLibrary;
 const heading=document.createElement("h2");
 heading.textContent=mod.name;
 const description=document.createElement("p");
 description.textContent=mod.description;
 const code=document.createElement("pre");
 code.className="modcode";
 code.textContent=mod.code;
 area.append(back,heading,description,code);
}

function deleteMod(index){
 if(!confirm("Удалить этот мод?"))return;
 const mods=getMods();
 mods.splice(index,1);
 localStorage.setItem(MODKEY,JSON.stringify(mods));
 showLibrary();
}

function answer(value){
 document.getElementById("answer").textContent=
 value==="Сатурн"?"Правильно! Отличная работа!":"Не совсем. Попробуй ещё!";
}

function saveDiary(){
 const input=document.getElementById("entry");
 const value=input.value.trim();
 if(!value)return;
 let entries=JSON.parse(localStorage.getItem("science_diary")||"[]");
 entries.unshift(value);
 localStorage.setItem("science_diary",JSON.stringify(entries));
 input.value="";
 showDiary();
}

function showDiary(){
 const entries=JSON.parse(localStorage.getItem("science_diary")||"[]");
 const area=document.getElementById("entries");
 area.innerHTML="";
 entries.forEach(x=>{
  const item=document.createElement("div");
  item.className="card";
  item.textContent=x;
  area.appendChild(item);
 });
}

function escapeText(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function backHome(){
 document.getElementById("page").style.display="none";
 document.getElementById("home").classList.remove("hidden");
}

function copyID(){
 navigator.clipboard.writeText(account.id)
 .then(()=>alert("ID скопирован!"))
 .catch(()=>alert("Скопируй ID вручную."));
}

function logout(){
 localStorage.removeItem(KEY);
 location.reload();
}

try{
 const saved=localStorage.getItem(KEY);
 if(saved)showAccount(JSON.parse(saved));
}catch(e){
 localStorage.removeItem(KEY);
}
</script>
</body>
</html>
